services:
  db:
    image: postgres:15
    container_name: myapp_db_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: BlazingPizzaDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: blazingpizza
    build:
      context: .
      dockerfile: BlazingPizza/Dockerfile
    container_name: myapp_app_dev
    ports:
      - "5000:8080"
    environment:
      - ApiBaseUrl=http://localhost:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=BlazingPizzaDb;Username=postgres;Password=postgres;Port=5432;
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_dev: